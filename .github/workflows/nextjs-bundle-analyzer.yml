name: Next.js Bundle Analysis

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label
        required: false
        default: 'ubuntu-22.04-sh'
        type: string
      node-version:
        description: Node.js version to use
        required: false
        default: '18'
        type: string
      registry-url:
        description: Optional npm registry URL for scoped/private packages
        required: false
        default: ''
        type: string
      registry-scope:
        description: Optional npm scope (e.g., '@your-scope') for auth
        required: false
        default: ''
        type: string
      working-directory:
        description: Directory containing the Next.js app
        required: false
        default: '.'
        type: string
      install-command:
        description: Install command to run (optional, overrides defaults)
        required: false
        default: ''
        type: string
      build-command:
        description: Build command to run (optional, overrides defaults)
        required: false
        default: ''
        type: string
      extra-env:
        description: Newline-delimited KEY=VALUE pairs exported to GITHUB_ENV
        required: false
        default: ''
        type: string
      app-id:
        description: GitHub App ID for generating installation token (falls back to vars.APP_ID if omitted)
        required: true
        type: string
    secrets:
      private-key:
        description: GitHub App private key (PEM) used to mint installation tokens
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  analyze:
    name: Analyze Bundle
    runs-on: ${{ inputs.runs-on }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Create App Token
        id: repo-token
        uses: Onemind-Services-LLC/actions/actions/create-repo-token@develop
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: Onemind-Services-LLC
          github-token: ${{ github.actor == 'dependabot[bot]' && github.token || '' }}

      - name: Ensure PR context
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "This reusable workflow must be invoked from a pull_request event." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect Package Manager
        id: pm
        uses: Onemind-Services-LLC/actions/actions/detect-package-manager@develop
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Apply extra environment variables
        if: inputs.extra-env != ''
        run: |
          printf "%s\n" "$INPUT" >> "$GITHUB_ENV"
        env:
          INPUT: ${{ inputs.extra-env }}

      - name: Install & Build
        uses: Onemind-Services-LLC/actions/actions/node-install-build@develop
        with:
          package-manager: ${{ steps.pm.outputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          build-command: ${{ inputs.build-command }}
          registry-url: ${{ inputs.registry-url }}
          registry-scope: ${{ inputs.registry-scope }}
          npm-token: ${{ steps.repo-token.outputs.token }}

      - name: Analyze bundle
        run: npx -y -p nextjs-bundle-analysis report

      - name: Upload analysis artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-bundle-analysis
          path: .next/analyze/__bundle_analysis.json
          overwrite: true

      - name: Download base branch artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          branch: ${{ github.event.pull_request.base.ref }}
          path: .next/analyze/base
          github_token: ${{ steps.repo-token.outputs.token }}
          if_no_artifact_found: warn

      - name: Compare with base
        run: npx -y nextjs-bundle-analysis compare
        continue-on-error: true

      - name: Get Comment Body
        id: get-comment-body
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat .next/analyze/__bundle_analysis_comment.txt >> $GITHUB_OUTPUT
          echo EOF >> $GITHUB_OUTPUT

      - name: Find Comment
        id: fc
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- __NEXTJS_BUNDLE -->'
          token: ${{ steps.repo-token.outputs.token }}

      - name: Create Comment
        if: steps.fc.outputs.comment-id == 0
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
          token: ${{ steps.repo-token.outputs.token }}

      - name: Update Comment
        if: steps.fc.outputs.comment-id != 0
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          token: ${{ steps.repo-token.outputs.token }}
