name: JavaScript Quality Checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Compatibility input; job selects ci-small, ci-test, or ci-build for enabled checks
        required: false
        default: ci-small
        type: string
      registry-url:
        description: Registry used for private npm packages
        type: string
        default: https://npm.pkg.github.com
      registry-scope:
        description: Scope used for private npm packages
        type: string
        default: "@onemind-services-llc"
      node-version:
        description: Node.js version
        required: false
        default: '22.x'
        type: string
      prettier-version:
        description: Optional Prettier version or dist-tag to run via npx (e.g., '3.3.3' or 'latest')
        required: false
        default: ''
        type: string
      working-directory:
        description: Directory to run checks in
        required: false
        default: '.'
        type: string
      patterns:
        description: Glob for Prettier check
        required: false
        default: '**/*.+(js|jsx|ts|tsx|json|css|scss)'
        type: string
      eslint-args:
        description: Additional ESLint args or target paths
        required: false
        default: '.'
        type: string
      eslint-version:
        description: Optional ESLint version or dist-tag to run via npx (e.g., '9.9.0' or 'latest')
        required: false
        default: ''
        type: string
      run-prettier:
        description: Run Prettier check
        required: false
        default: true
        type: boolean
      run-eslint:
        description: Run ESLint check
        required: false
        default: true
        type: boolean
      run-browserslist:
        description: Run Browserslist lock check
        required: false
        default: true
        type: boolean
      run-typescript:
        description: Run TypeScript type check
        required: false
        default: false
        type: boolean
      run-bundle-check:
        description: Run bundle integrity check
        required: false
        default: false
        type: boolean
      bundle-dist-path:
        description: Repo-relative dist path to check
        required: false
        default: ''
        type: string
      bundle-command:
        description: Explicit bundle command (overrides defaults)
        required: false
        default: ''
        type: string
      tsconfig:
        description: Path to tsconfig file for tsc
        required: false
        default: ''
        type: string
      tsc-args:
        description: Additional arguments to pass to tsc (default '--noEmit')
        required: false
        default: '--noEmit'
        type: string
    secrets:
      GIT_TOKEN:
        description: Optional token for private packages; defaults to github.token
        required: false

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: JavaScript Quality Checks
    runs-on: ${{ inputs.run-bundle-check && 'ci-build' || inputs.run-typescript && 'ci-test' || 'ci-small' }}
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
      NPM_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Package Registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.registry-scope }}

      - name: Prettier Check
        if: ${{ inputs.run-prettier }}
        uses: Onemind-Services-LLC/actions/actions/prettier-check@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          patterns: ${{ inputs.patterns }}
          version: ${{ inputs.prettier-version }}

      - name: ESLint Check
        if: ${{ inputs.run-eslint }}
        uses: Onemind-Services-LLC/actions/actions/eslint-check@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          eslint-args: ${{ inputs.eslint-args }}
          version: ${{ inputs.eslint-version }}

      - name: Browserslist Lock Check
        if: ${{ inputs.run-browserslist }}
        uses: Onemind-Services-LLC/actions/actions/browserslist-lock-check@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Bundle Integrity Check
        if: ${{ inputs.run-bundle-check }}
        uses: Onemind-Services-LLC/actions/actions/bundle-integrity-check@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          dist-path: ${{ inputs.bundle-dist-path }}
          bundle-command: ${{ inputs.bundle-command }}

      - name: TypeScript Type Check
        if: ${{ inputs.run-typescript }}
        uses: Onemind-Services-LLC/actions/actions/typescript-check@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
          tsconfig: ${{ inputs.tsconfig }}
          tsc-args: ${{ inputs.tsc-args }}
