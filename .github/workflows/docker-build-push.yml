name: Docker Build + Push + Sign

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner label
        required: false
        default: 'ubuntu-22.04-sh'
        type: string
      push:
        description: >-
          Whether to push images (override). Accepts 'true' or 'false'.
          If omitted, defaults to pushing only on the repository's
          default branch.
        required: false
        default: ''
        type: string
      image:
        description: Base image name (e.g., registry.example.com/org/app)
        required: true
        type: string
      meta-tags:
        description: docker/metadata-action tags rules (newline-separated)
        required: false
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha
        type: string
      annotations:
        description: Additional newline-separated OCI annotations to merge with docker/metadata-action output
        required: false
        default: ''
        type: string
      build-args:
        description: Newline-separated build args (KEY=VALUE)
        required: false
        default: ''
        type: string
      build-secrets:
        description: Newline-separated build secrets (KEY=VALUE). Forwarded to Buildx as secrets.
        required: false
        default: ''
        type: string
      cache-image:
        description: Registry reference used by Buildx cache (e.g., ghcr.io/org/app:buildcache-main)
        required: true
        type: string
      registry:
        description: Registry hostname for login (e.g., ghcr.io)
        required: true
        type: string
    outputs:
      digest:
        description: Built image digest
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      GIT_TOKEN:
        description: Token for private build dependencies, passed directly as the github_token build secret when supplied
        required: false
      username:
        description: Registry username
        required: true
      password:
        description: Registry password/token
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Decide whether to push
        id: decide-push
        shell: bash
        env:
          INPUT_PUSH: ${{ inputs.push }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "${INPUT_PUSH}" ]]; then
            case "${INPUT_PUSH}" in
              true|false)
                echo "value=${INPUT_PUSH}" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "Invalid inputs.push: '${INPUT_PUSH}'. Expected 'true' or 'false'." >&2
                exit 1 ;;
            esac
          else
            if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
              echo "value=true" >> "$GITHUB_OUTPUT"
            else
              echo "value=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Merge user build-secrets with Git token
        id: merged_secrets
        shell: bash
        env:
          USER_SECRETS: ${{ inputs.build-secrets }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          {
            delimiter="build_secrets_$(openssl rand -hex 16)"
            echo "value<<$delimiter"
            {
              if [ -n "${USER_SECRETS}" ]; then printf '%s\n' "${USER_SECRETS}"; fi
              if [ -n "${GIT_TOKEN:-}" ]; then
                printf 'github_token=%s\n' "${GIT_TOKEN}"
              fi
            } | awk 'NF'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build, push, sign
        id: build
        uses: Onemind-Services-LLC/actions/actions/docker-build-push@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          images: ${{ inputs.image }}
          meta-tags: ${{ inputs.meta-tags }}
          annotations: ${{ inputs.annotations }}
          push: ${{ steps.decide-push.outputs.value }}
          build-args: ${{ inputs.build-args }}
          build-secrets: ${{ steps.merged_secrets.outputs.value }}
          cache-image: ${{ inputs.cache-image }}
          registry: ${{ inputs.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
