name: Cypress Component Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: Compatibility input; jobs always use ci-build
        required: false
        default: 'ci-build'
        type: string
      browsers:
        description: JSON array of browsers (e.g., ["chrome","edge","firefox"]).
        required: false
        default: '["chrome","edge","firefox"]'
        type: string
      registry-url:
        description: NPM registry URL for private packages
        required: false
        default: 'https://npm.pkg.github.com'
        type: string
      registry-scope:
        description: NPM scope used for auth (e.g., @onemind-services-llc)
        required: false
        default: '@onemind-services-llc'
        type: string
      working-directory:
        description: Directory containing the project to test
        required: false
        default: '.'
        type: string
      node-version:
        description: Node.js version to use
        required: false
        default: '22.x'
        type: string
    secrets:
      GIT_TOKEN:
        description: Token for private GitHub packages; defaults to github.token when omitted
        required: false

permissions:
  contents: read
  packages: read

jobs:
  component_tests:
    name: Component Tests
    runs-on: ci-build
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Cypress Component Tests
        uses: Onemind-Services-LLC/actions/actions/cypress-test@334a662a25fab25232599ca598a9dbfd08b83c20
        with:
          component: true
          browser: ${{ matrix.browser }}
          registry-scope: ${{ inputs.registry-scope }}
          registry-url: ${{ inputs.registry-url }}
          npm-token: ${{ secrets.GIT_TOKEN || github.token }}
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
