name: Scan Container Artifact

on:
  workflow_call:
    inputs:
      artifact-id:
        description: Immutable OCI artifact ID from the build job
        required: true
        type: string
      digest:
        description: Expected OCI image index digest
        required: true
        type: string
      runs-on:
        description: Compatibility input; jobs always use ci-build
        type: string
        default: ci-build

permissions:
  contents: read

jobs:
  scan:
    name: Container Vulnerabilities
    runs-on: ci-build
    timeout-minutes: 20
    steps:
      - name: Download Exact Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/container
      - name: Install OCI Tools
        uses: Onemind-Services-LLC/actions/actions/install-apt-packages@c092b25b4c78cd2cf3dc9b5cf27aaaa5e39c519a
        with:
          packages: skopeo
      - name: Verify Image Digest
        env:
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          actual="sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/container/image.tar" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_DIGEST"
          # Trivy accepts an OCI layout directory, not a BuildKit OCI tar archive.
          skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/container/image.tar" \
            "oci:$RUNNER_TEMP/scan-layout:tested"
      - name: Scan Image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # reviewed 2026-09-07
        with:
          version: v0.74.0
          input: ${{ runner.temp }}/scan-layout
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy.json
          cache: false
      - name: Retain Scan Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy.json
          if-no-files-found: error
          retention-days: 14
