name: Python Package Publish

on:
  workflow_call:
    inputs:
      runs-on:
        description: Compatibility input; jobs always use ci-test
        required: false
        default: 'ci-test'
        type: string
      python-version:
        description: Python version to use
        required: false
        default: '3.x'
        type: string
      working-directory:
        description: Directory containing the Python package
        required: false
        default: '.'
        type: string
      build-command:
        description: Command to build distributions (sdist/wheel)
        required: false
        default: 'python -m build'
        type: string
      skip-existing:
        description: "If 'true', skip uploading files that already exist"
        required: false
        default: 'false'
        type: string
    secrets:
      pypi-token:
        description: PyPI API token (beginning with 'pypi-')
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Python Package Index (Token)
    runs-on: ci-test
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python setup and build deps
        uses: Onemind-Services-LLC/actions/actions/python-setup-install@334a662a25fab25232599ca598a9dbfd08b83c20
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          upgrade-pip: 'true'
          extra-install-commands: pip install build

      - name: Build distributions
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.pypi-token }}
          packages-dir: ${{ inputs.working-directory }}/dist
          skip-existing: ${{ inputs.skip-existing }}
