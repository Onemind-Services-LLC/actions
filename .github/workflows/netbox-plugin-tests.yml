name: NetBox Plugin Tests

on:
  workflow_call:
    inputs:
      plugin-name:
        description: 'The name of the NetBox plugin, eg: netbox_secrets'
        required: true
        type: string
      netbox-version:
        description: 'NetBox version to use, eg: v4.3.0'
        required: false
        default: 'v4.5.5'
        type: string
      python-version:
        description: 'Python version to use, eg: 3.12'
        required: false
        default: '3.12'
        type: string
      runs-on:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ci-test'
      lint-runs-on:
        description: 'GitHub runner for pre-commit checks; empty uses runs-on'
        required: false
        type: string
        default: 'ci-small'
      coverage-minimum:
        description: 'Minimum acceptable code coverage percentage'
        required: false
        type: number
        default: 100
      coverage-args:
        description: 'Extra arguments passed to `coverage xml` (e.g. --omit=*/migrations/*,*/templates/*,*/static/*)'
        required: false
        type: string
        default: '--omit=*/migrations/*,*/templates/*,*/static/*,*/tests/*'
    secrets:
      DOCKER_USERNAME:
        description: Registry username for service image pulls
        required: true
      DOCKER_PASSWORD:
        description: Registry password for service image pulls
        required: true
      GIT_TOKEN:
        description: Token for private plugin dependencies; defaults to github.token when omitted
        required: false

env:
  ACTIONS_WORKING_DIRECTORY: actions
  NETBOX_WORKING_DIRECTORY: netbox

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Pre-commit
    uses: ./.github/workflows/pre-commit.yml
    with:
      runs-on: ${{ inputs.lint-runs-on || inputs.runs-on }}

  test:
    name: Run Tests
    runs-on: ${{ inputs.runs-on }}
    needs: lint

    services:
      redis:
        image: registry.onemindservices.com/docker.io/library/redis:latest
        credentials:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      postgres:
        image: registry.onemindservices.com/docker.io/library/postgres:17-alpine
        credentials:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout NetBox Repository
        uses: actions/checkout@v6
        with:
          repository: "netbox-community/netbox"
          path: netbox
          ref: ${{ inputs.netbox-version }}

      - name: Checkout Plugin Repository
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.plugin-name }}

      - name: Checkout Actions Repository
        uses: actions/checkout@v6
        with:
          repository: "Onemind-Services-LLC/actions"
          path: ${{ env.ACTIONS_WORKING_DIRECTORY }}
          ref: 3cc80b064ebe1023e05533efa15b47c43ead5ef9

      - name: Setup NetBox Requirements
        uses: Onemind-Services-LLC/actions/actions/python-setup-install@3cc80b064ebe1023e05533efa15b47c43ead5ef9
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ env.NETBOX_WORKING_DIRECTORY }}
          pre-install-commands: |
            sudo apt-get update && sudo apt-get install -y libpq-dev
            python3 -m pip install "setuptools<81"

      - name: Setup Plugin Requirements
        uses: Onemind-Services-LLC/actions/actions/python-setup-install@3cc80b064ebe1023e05533efa15b47c43ead5ef9
        # Limit Git authentication to this install step and its child processes.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GIT_TOKEN || github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.plugin-name }}
          extra-install-commands: |
            pip install -e .

      - name: Use Plugin Test Configuration
        run: |
          cp -f "${{ inputs.plugin-name }}/testing_configuration/configuration.py" \
            "${{ env.NETBOX_WORKING_DIRECTORY }}/netbox/netbox/configuration.py"

      - name: Run Tests
        uses: Onemind-Services-LLC/actions/actions/django-test-runner@cf62d1269631735ccc36988e8065f8ef4b1b8868
        with:
          working-directory: ${{ env.NETBOX_WORKING_DIRECTORY }}/netbox
          django-settings-module-key: NETBOX_CONFIGURATION
          django-settings-module: netbox.configuration
          test-args: ${{ inputs.plugin-name }}.tests
          coverage-report: true
          coverage-github-token: ${{ github.token }}
          coverage-pull-request-number: ${{ github.event.pull_request.number || '' }}
          coverage-source: ${{ inputs.plugin-name }}
          coverage-minimum: ${{ inputs.coverage-minimum }}
          coverage-args: ${{ inputs.coverage-args }}
          verbosity: '3'
