name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and Pipeline Contracts
    runs-on: ci-small
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Validators
        run: |
          python -m pip install yamllint==1.38.0 zizmor==1.30.1
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate YAML and New Pipeline Workflows
        run: |
          yamllint .
          "$RUNNER_TEMP/actionlint" .github/workflows/container-*.yml .github/workflows/python-security.yml .github/workflows/ci.yml
          zizmor --offline --min-severity high .github/workflows/container-*.yml .github/workflows/python-security.yml \
            .github/workflows/ci.yml actions/django-test-runner/action.yml actions/python-setup-install/action.yml \
            actions/install-apt-packages/action.yml
      - name: Test Failure Gates and Credential Isolation
        run: python -m unittest discover -s tests

  artifact_contract:
    name: OCI Artifact Contract
    needs: lint
    runs-on: ci-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Login for Build Tool Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.onemindservices.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=registry.onemindservices.com/docker.io/moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build Fixture with Attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/oci
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/fixture.tar
          provenance: mode=max
          sbom: generator=registry.onemindservices.com/docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          push: false
      - name: Upload OCI Fixture
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-contract-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Download Exact OCI Fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/downloaded
      - name: Install OCI Tools
        uses: ./actions/install-apt-packages
        with:
          packages: skopeo
      - name: Verify Digest and Attestation Preservation
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          source="oci-archive:$RUNNER_TEMP/downloaded/fixture.tar"
          actual="sha256:$(skopeo inspect --raw "$source" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_DIGEST"
          skopeo copy --all --preserve-digests "$source" "oci:$RUNNER_TEMP/copied:tested"
          copied="sha256:$(skopeo inspect --raw "oci:$RUNNER_TEMP/copied:tested" | sha256sum | cut -d ' ' -f 1)"
          test "$copied" = "$EXPECTED_DIGEST"
          skopeo copy "$source" docker-daemon:ci-artifact:tested
          python tests/verify_attestations.py "$RUNNER_TEMP/copied"
      - name: Verify Scanner Can Read the OCI Layout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: ${{ runner.temp }}/copied
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: false
