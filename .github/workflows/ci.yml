name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and Pipeline Contracts
    runs-on: ci-small
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Validators
        run: |
          python -m pip install yamllint==1.38.0 zizmor==1.30.0
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate YAML and New Pipeline Workflows
        run: |
          yamllint .
          "$RUNNER_TEMP/actionlint" .github/workflows/container-*.yml .github/workflows/python-security.yml .github/workflows/ci.yml
          zizmor --offline --min-severity high .github/workflows/container-*.yml .github/workflows/python-security.yml \
            .github/workflows/ci.yml actions/django-test-runner/action.yml actions/python-setup-install/action.yml \
            actions/docker-setup/action.yml actions/docker-bake/action.yml \
            actions/artifact-upload/action.yml actions/artifact-download/action.yml
      - name: Test Failure Gates and Credential Isolation
        run: python -m unittest discover -s tests

  artifact_contract:
    name: OCI Artifact Contract
    needs: lint
    runs-on: ci-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set Up Authenticated Build Tools
        uses: ./actions/docker-setup
        with:
          registry: registry.onemindservices.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Fixture with Attestations
        id: build
        uses: ./actions/docker-bake
        with:
          files: tests/oci/docker-bake.hcl
          target: fixture
          allow: fs.write=${{ runner.temp }}
          set: fixture.output=type=oci,dest=${{ runner.temp }}/fixture.tar
          push: false
      - name: Record Artifact Fixture
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = {'digest': os.environ['EXPECTED_DIGEST'], 'sha': os.environ['GITHUB_SHA']}
          (Path(os.environ['RUNNER_TEMP']) / 'fixture.json').write_text(json.dumps(record))
          PY
      - name: Upload Image Fixture
        uses: ./actions/artifact-upload
        with:
          name: oci-contract-image
          path: |
            ${{ runner.temp }}/fixture.tar
            ${{ runner.temp }}/fixture.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload Metadata Fixture
        uses: ./actions/artifact-upload
        with:
          name: oci-contract-metadata
          path: ${{ runner.temp }}/fixture.json
          if-no-files-found: error
          retention-days: 1
      - name: Download Named Artifact Directories
        uses: ./actions/artifact-download
        with:
          pattern: oci-contract-*
          path: ${{ runner.temp }}/downloaded
          merge-multiple: false
      - name: Verify Artifact Transfer
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/fixture.tar" "$RUNNER_TEMP/downloaded/oci-contract-image/fixture.tar"
          cmp "$RUNNER_TEMP/fixture.json" "$RUNNER_TEMP/downloaded/oci-contract-image/fixture.json"
          cmp "$RUNNER_TEMP/fixture.json" "$RUNNER_TEMP/downloaded/oci-contract-metadata/fixture.json"
      - name: Verify Digest and Attestation Preservation
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          source="oci-archive:$RUNNER_TEMP/fixture.tar"
          actual="sha256:$(skopeo inspect --raw "$source" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_DIGEST"
          skopeo copy --all --preserve-digests "$source" "oci:$RUNNER_TEMP/copied:tested"
          copied="sha256:$(skopeo inspect --raw "oci:$RUNNER_TEMP/copied:tested" | sha256sum | cut -d ' ' -f 1)"
          test "$copied" = "$EXPECTED_DIGEST"
          skopeo copy "$source" docker-daemon:ci-artifact:tested
          python tests/verify_attestations.py "$RUNNER_TEMP/copied"
      - name: Verify Scanner Can Read the OCI Layout
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # reviewed 2026-09-07
        with:
          version: v0.74.0
          input: ${{ runner.temp }}/copied
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: false
