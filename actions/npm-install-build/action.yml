name: NPM Install & Build
description: >-
  Install dependencies and build a Node.js project using npm with caching and
  optional registry auth. Consider using Node Install & Build for npm/yarn support.

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22.x'
  working-directory:
    description: Directory containing the project
    required: false
    default: '.'
  install:
    description: Whether to run the install step
    required: false
    default: 'true'
  install-command:
    description: Install command to run
    required: false
    default: 'npm ci --no-audit'
  build:
    description: Whether to run the build step
    required: false
    default: 'true'
  build-command:
    description: Build command to run
    required: false
    default: 'npm run build'
  registry-url:
    description: Optional npm registry URL for scoped/private packages
    required: false
    default: ''
  registry-scope:
    description: Optional npm scope (e.g., '@your-scope') for auth
    required: false
    default: ''
  npm-token:
    description: NPM auth token for private registry access
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Deprecation Notice
      shell: bash
      run: |
        echo "⚠️ npm-install-build is deprecated. Use node-install-build instead." >> "$GITHUB_STEP_SUMMARY"
        echo "::warning::'Onemind-Services-LLC/actions/actions/npm-install-build' is deprecated."
        echo "::warning::Use 'Onemind-Services-LLC/actions/actions/node-install-build' with 'package-manager'."

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.registry-scope }}

    - name: Cache npm dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - name: Build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
