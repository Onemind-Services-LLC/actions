name: Upload Archived Artifact
description: Upload named ZIP artifacts while preserving their paths and retention policy.
inputs:
  name:
    description: Name of the artifact
    default: artifact
  path:
    description: Files, directories, or newline-separated paths to upload
    required: true
  if-no-files-found:
    description: Behavior when no files match; warn, error, or ignore
    default: warn
  retention-days:
    description: Retention in days; zero uses the repository default
    default: '0'
  compression-level:
    description: ZIP compression level from zero to nine
    default: '6'
  include-hidden-files:
    description: Include hidden files only when explicitly requested
    default: 'false'
outputs:
  artifact-id:
    description: Immutable artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Authenticated artifact download URL
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded archive
    value: ${{ steps.upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Upload ZIP Artifact
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        archive: true
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
