name: Django Test Runner
description: Run Django checks, migrations, collectstatic, and tests with coverage.

inputs:
  working-directory:
    description: Directory containing manage.py
    required: false
    default: '.'
  django-settings-module-key:
    description: Env var name to export the settings module under
    required: false
    default: 'DJANGO_SETTINGS_MODULE'
  django-settings-module:
    description: Required DJANGO_SETTINGS_MODULE to export for commands
    required: true
  coverage-report:
    description: Generate a Code Coverage Summary and post a sticky PR comment
    required: false
    default: 'false'
  coverage-file:
    description: Path to coverage XML file
    required: false
    default: 'coverage.xml'
  coverage-minimum:
    description: Minimum coverage percentage threshold
    required: false
    default: '80'
  coverage-fail-below-threshold:
    description: Fail when below minimum coverage
    required: false
    default: 'true'
  coverage-show-branch:
    description: Show branch coverage column
    required: false
    default: 'true'
  coverage-report-name:
    description: Unique name for the report/comment
    required: false
    default: ''
  coverage-pull-request-number:
    description: Pull request number when not using pull_request trigger
    required: false
    default: ''
  coverage-continue-on-error:
    description: Continue on error when posting report
    required: false
    default: 'true'
  coverage-github-token:
    description: GitHub token to use for posting the PR comment (defaults to github.token)
    required: false
    default: ''
  verbosity:
    description: Django command verbosity (0-3)
    required: false
    default: '3'
  test-args:
    description: Extra arguments passed to `manage.py test`
    required: false
    default: ''
  coverage-args:
    description: Extra arguments passed to `coverage xml`
    required: false
    default: ''
  coverage-source:
    description: Comma-separated modules/paths to measure coverage for (passed to `coverage run --source`)
    required: false
    default: ''
  pytest-paths:
    description: Optional space-separated pytest paths to run in addition to Django tests
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Export Django settings to env
      shell: bash
      env:
        SETTINGS_KEY: ${{ inputs.django-settings-module-key }}
        SETTINGS_MODULE: ${{ inputs.django-settings-module }}
      run: |
        python - <<'PYTHON'
        import os
        import re
        key, module = os.environ['SETTINGS_KEY'], os.environ['SETTINGS_MODULE']
        if not re.fullmatch(r'[A-Z][A-Z0-9_]*', key) or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_.]*', module):
            raise SystemExit('Invalid settings environment key or Python module')
        if not (key.endswith('_SETTINGS_MODULE') or key == 'NETBOX_CONFIGURATION'):
            raise SystemExit('Settings key must end in _SETTINGS_MODULE or be NETBOX_CONFIGURATION')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'{key}={module}\n')
        PYTHON

    - name: Install Coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip install coverage==7.15.3

    - name: Check migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python manage.py makemigrations --check --dry-run

    - name: Database migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERBOSITY: ${{ inputs.verbosity }}
      run: python manage.py migrate -v "$VERBOSITY"

    - name: Collect static files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python manage.py collectstatic --noinput

    - name: Run Django checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERBOSITY: ${{ inputs.verbosity }}
      run: python manage.py check -v "$VERBOSITY"

    - name: Run tests with coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COVERAGE_SOURCE: ${{ inputs.coverage-source }}
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        coverage erase
        python - <<'PYTHON'
        import os
        import shlex
        import subprocess
        command = ['coverage', 'run']
        if os.environ['COVERAGE_SOURCE']:
            command += ['--source=' + os.environ['COVERAGE_SOURCE']]
        subprocess.run(command + ['manage.py', 'test'] + shlex.split(os.environ['TEST_ARGS']), check=True)
        PYTHON

    - name: Run additional pytest tests
      if: inputs.pytest-paths != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTEST_PATHS: ${{ inputs.pytest-paths }}
      run: |
        read -r -a paths <<< "$PYTEST_PATHS"
        coverage run --append -m pytest "${paths[@]}" --junitxml=pytest-results.xml

    - name: Generate coverage XML
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COVERAGE_ARGS: ${{ inputs.coverage-args }}
      run: |
        python - <<'PYTHON'
        import os
        import shlex
        import subprocess
        subprocess.run(['coverage', 'xml'] + shlex.split(os.environ['COVERAGE_ARGS']), check=True)
        PYTHON

    - name: Enforce coverage threshold
      if: inputs.coverage-fail-below-threshold == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COVERAGE_MINIMUM: ${{ inputs.coverage-minimum }}
      run: coverage report --fail-under="$COVERAGE_MINIMUM"

    - name: Coverage Reporter
      if: ${{ inputs.coverage-report == 'true' }}
      continue-on-error: ${{ inputs.coverage-continue-on-error == 'true' }}
      uses: Onemind-Services-LLC/actions/actions/cobertura-report@3cc80b064ebe1023e05533efa15b47c43ead5ef9
      with:
        working-directory: ${{ inputs.working-directory }}
        path: ${{ inputs.coverage-file }}
        minimum-coverage: ${{ inputs.coverage-minimum }}
        fail-below-threshold: ${{ inputs.coverage-fail-below-threshold }}
        show-branch: ${{ inputs.coverage-show-branch }}
        report-name: ${{ inputs.coverage-report-name }}
        pull-request-number: ${{ inputs.coverage-pull-request-number }}
        github-token: ${{ inputs.coverage-github-token }}

branding:
  icon: check-circle
  color: purple
